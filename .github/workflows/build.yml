name: Build and Test

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]

# The repo's default workflow token is read-only on contents and packages
# and has nothing else, so the paths filter needs pull-requests read to list
# a PR's files.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect build changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Detect build-related changes
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: |
          relevant:
            - 'Sources/**'
            - 'Tests/**'
            - 'Fluid.xcodeproj/**'
            - 'Package.swift'
            - 'Package.resolved'
            - 'Info.plist'
            - 'Fluid.entitlements'
            - '.swiftlint.yml'
            - '.github/workflows/build.yml'

  lint:
    name: SwiftLint
    if: needs.changes.outputs.relevant == 'true' && (github.event_name == 'push' || github.event.pull_request.draft == false)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run SwiftLint (strict)
      run: |
        docker run --rm \
          --volume "$PWD:$PWD" \
          --workdir "$PWD" \
          ghcr.io/realm/swiftlint:0.63.2 \
          lint --strict --config .swiftlint.yml

  build:
    name: Build FluidVoice
    if: needs.changes.outputs.relevant == 'true' && needs.lint.result == 'success'
    needs: [changes, lint]
    runs-on: macos-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install xcpretty
      run: sudo gem install xcpretty

    - name: Cache Whisper models
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/WhisperModels
        key: ${{ runner.os }}-whisper-models-transcribecpp-v1

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Show Xcode version
      run: xcodebuild -version
      
    - name: Run standalone onboarding regressions
      run: sh Tests/run_onboarding_tests.sh

    - name: Run release highlights regressions
      run: sh Tests/run_release_highlights_tests.sh

    - name: Run history decode recovery regressions
      run: sh Tests/run_history_decode_recovery_tests.sh

    - name: Run latency budget regressions
      run: sh Tests/run_latency_budget_tests.sh

    - name: Run dictation latency stats regressions
      run: sh Tests/run_dictation_latency_stats_tests.sh

    - name: Run short dictation regressions
      run: sh Tests/run_short_dictation_tests.sh

    - name: Run Edit mode reasoning lookup regressions
      run: sh Tests/run_rewrite_mode_reasoning_tests.sh

    - name: Run Command Mode cancellation regressions
      run: sh Tests/run_command_cancellation_tests.sh

    - name: Run dictation prompt request regressions
      run: sh Tests/run_dictation_prompt_request_tests.sh

    - name: Run settings backup concurrency regressions
      run: python3 Tests/run_settings_backup_concurrency_tests.py

    - name: Check every setting is backed up or listed as not backed up
      run: python3 Tests/run_backup_coverage_tests.py

    - name: Run meeting backup refresh regressions
      run: python3 Tests/run_meeting_backup_refresh_tests.py

    # Tiny Whisper GGUF output is nondeterministic on hosted macOS runners.
    # Keep this E2E assertion in the suite for local validation, but skip it in CI.
    - name: Build and test (excluding flaky Tiny Whisper E2E)
      run: |
        set -o pipefail
        xcodebuild test \
          -project Fluid.xcodeproj \
          -scheme Fluid \
          -destination 'platform=macOS,arch=arm64' \
          -skip-testing:FluidDictationIntegrationTests/DictationE2ETests/testDictationEndToEnd_whisperTiny_transcribesFixture \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty
