name: Build and Test

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]

# The repo's default workflow token is read-only on contents and packages
# and has nothing else, so the paths filter needs pull-requests read to list
# a PR's files.
permissions:
  contents: read
  pull-requests: read

# The slowest XCTest classes (about 100 of the 200 seconds of tests): they
# wait on real start and stop timeouts. They run in their own job, beside the
# rest, so the two halves finish at about the same time. MeetingRecoveryTests
# (about 30 seconds) stays with the rest to keep the halves even.
env:
  SLOW_SUITES: >-
    AudioRouteRecoveryIntegrationTests
    CustomDictionaryManualEntryTests
    NormalAudioCaptureCompatibilityTests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect build changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Detect build-related changes
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: |
          relevant:
            - 'Sources/**'
            - 'Tests/**'
            - 'Fluid.xcodeproj/**'
            - 'Package.swift'
            - 'Package.resolved'
            - 'Info.plist'
            - 'Fluid.entitlements'
            - '.swiftlint.yml'
            - '.github/workflows/build.yml'

  lint:
    name: SwiftLint
    if: needs.changes.outputs.relevant == 'true' && (github.event_name == 'push' || github.event.pull_request.draft == false)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run SwiftLint (strict)
      run: |
        docker run --rm \
          --volume "$PWD:$PWD" \
          --workdir "$PWD" \
          ghcr.io/realm/swiftlint:0.63.2 \
          lint --strict --config .swiftlint.yml

  # Runs beside SwiftLint rather than after it; both are required, so a lint
  # failure still blocks the merge.
  build:
    name: Build and test
    if: needs.changes.outputs.relevant == 'true' && (github.event_name == 'push' || github.event.pull_request.draft == false)
    needs: changes
    runs-on: macos-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install xcpretty
      run: sudo gem install xcpretty

    - name: Cache Whisper models
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/WhisperModels
        key: ${{ runner.os }}-whisper-models-transcribecpp-v1

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Show Xcode version
      id: xcode
      run: |
        xcodebuild -version
        echo "version=$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"

    # Kept build folder, the way Audiout caches its SwiftPM build: a PR's own
    # cache is found before main's, so a second push rebuilds only its diff.
    # Restored files are older than the fresh checkout, so the Swift compiler
    # compares file contents (-enable-incremental-file-hashing below) instead
    # of timestamps to decide what to recompile.
    - name: Restore build cache
      uses: actions/cache/restore@v4
      with:
        path: DerivedData
        key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-dd-${{ hashFiles('Package.resolved', 'Fluid.xcodeproj/project.pbxproj') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-dd-${{ hashFiles('Package.resolved', 'Fluid.xcodeproj/project.pbxproj') }}-
          ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-dd-
      
    - name: Run standalone onboarding regressions
      run: sh Tests/run_onboarding_tests.sh

    - name: Run release highlights regressions
      run: sh Tests/run_release_highlights_tests.sh

    - name: Run history decode recovery regressions
      run: sh Tests/run_history_decode_recovery_tests.sh

    - name: Run latency budget regressions
      run: sh Tests/run_latency_budget_tests.sh

    - name: Run dictation latency stats regressions
      run: sh Tests/run_dictation_latency_stats_tests.sh

    - name: Run short dictation regressions
      run: sh Tests/run_short_dictation_tests.sh

    - name: Run Command Mode cancellation regressions
      run: sh Tests/run_command_cancellation_tests.sh

    - name: Run dictation prompt request regressions
      run: sh Tests/run_dictation_prompt_request_tests.sh

    - name: Run settings backup concurrency regressions
      run: python3 Tests/run_settings_backup_concurrency_tests.py

    - name: Check every setting is backed up or listed as not backed up
      run: python3 Tests/run_backup_coverage_tests.py

    - name: Run meeting backup refresh regressions
      run: python3 Tests/run_meeting_backup_refresh_tests.py

    # Tiny Whisper GGUF output is nondeterministic on hosted macOS runners.
    # Keep this E2E assertion in the suite for local validation, but skip it in CI.
    - name: Build and test (excluding flaky Tiny Whisper E2E and the slow suites)
      run: |
        set -o pipefail
        skip=()
        for suite in $SLOW_SUITES; do skip+=("-skip-testing:FluidDictationIntegrationTests/$suite"); done
        xcodebuild test \
          -project Fluid.xcodeproj \
          -scheme Fluid \
          -destination 'platform=macOS,arch=arm64' \
          -skip-testing:FluidDictationIntegrationTests/DictationE2ETests/testDictationEndToEnd_whisperTiny_transcribesFixture \
          "${skip[@]}" \
          -derivedDataPath DerivedData \
          COMPILER_INDEX_STORE_ENABLE=NO \
          OTHER_SWIFT_FLAGS='$(inherited) -enable-incremental-file-hashing' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty

    # Saved even when a test failed: the build products are still valid, and
    # a cache that saves only on green never warms up.
    - name: Save build cache
      if: ${{ !cancelled() }}
      uses: actions/cache/save@v4
      with:
        path: DerivedData
        key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-dd-${{ hashFiles('Package.resolved', 'Fluid.xcodeproj/project.pbxproj') }}-${{ github.sha }}

  slow-tests:
    name: Slow test suites
    if: needs.changes.outputs.relevant == 'true' && (github.event_name == 'push' || github.event.pull_request.draft == false)
    needs: changes
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install xcpretty
      run: sudo gem install xcpretty

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Xcode version
      id: xcode
      run: |
        xcodebuild -version
        echo "version=$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"

    # Reads the cache "Build and test" saves; only that job saves, so the two
    # jobs never race on one key.
    - name: Restore build cache
      uses: actions/cache/restore@v4
      with:
        path: DerivedData
        key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-dd-${{ hashFiles('Package.resolved', 'Fluid.xcodeproj/project.pbxproj') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-dd-${{ hashFiles('Package.resolved', 'Fluid.xcodeproj/project.pbxproj') }}-
          ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-dd-

    - name: Build and run the slow suites
      run: |
        set -o pipefail
        only=()
        for suite in $SLOW_SUITES; do only+=("-only-testing:FluidDictationIntegrationTests/$suite"); done
        xcodebuild test \
          -project Fluid.xcodeproj \
          -scheme Fluid \
          -destination 'platform=macOS,arch=arm64' \
          "${only[@]}" \
          -derivedDataPath DerivedData \
          COMPILER_INDEX_STORE_ENABLE=NO \
          OTHER_SWIFT_FLAGS='$(inherited) -enable-incremental-file-hashing' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty

  # The check the main ruleset requires. It passes when both test jobs pass,
  # or when the PR touches nothing that builds. Skipped on drafts, like the
  # jobs it waits for.
  gate:
    name: Build FluidVoice
    if: always() && (github.event_name == 'push' || github.event.pull_request.draft == false)
    needs: [changes, build, slow-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Both test jobs passed
      env:
        CHANGES: ${{ needs.changes.result }}
        RELEVANT: ${{ needs.changes.outputs.relevant }}
        BUILD: ${{ needs.build.result }}
        SLOW: ${{ needs.slow-tests.result }}
      run: |
        echo "changes=$CHANGES relevant=$RELEVANT build=$BUILD slow-tests=$SLOW"
        [ "$CHANGES" = success ] || exit 1
        [ "$RELEVANT" = true ] || exit 0
        [ "$BUILD" = success ] && [ "$SLOW" = success ]
