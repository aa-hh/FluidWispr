name: Test build

# Builds an ad-hoc signed app Ali can download and run, for each PR, main, or on demand.
on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'Sources/**'
      - 'Fluid.xcodeproj/**'
      - 'Info.plist'
      - 'Fluid.entitlements'
      - 'build.sh'
      - '.github/workflows/test-build.yml'
  push:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Fluid.xcodeproj/**'
      - 'Info.plist'
      - 'Fluid.entitlements'
      - 'build.sh'
      - '.github/workflows/test-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Build downloadable app
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build
      run: ./build.sh adhoc

    - name: Package
      run: |
        set -euo pipefail
        short_sha="$(git rev-parse --short HEAD)"
        echo "short_sha=${short_sha}" >> "$GITHUB_ENV"
        mkdir -p dist
        ditto -c -k --keepParent "DerivedData/Build/Products/Debug/FluidVoice Debug.app" "dist/FluidWispr-${short_sha}.zip"

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: FluidWispr-${{ env.short_sha }}
        path: dist/FluidWispr-${{ env.short_sha }}.zip
        retention-days: 30
